name: Bug report / Ошибка
description: Something doesn't work / Что-то не работает
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened / Что произошло
      description: What you did, what you expected and what you got. / Что делали, что ожидали и что получилось.
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot of the text / Скриншот текста
      description: A screenshot of the area without the frame helps to reproduce OCR problems. / Скриншот области без рамки помогает воспроизвести проблемы распознавания.
  - type: input
    id: setup
    attributes:
      label: Version, Windows, engine / Версия, Windows, сервис
      placeholder: 0.1.0, Windows 11, Google, Thai → English
  - type: textarea
    id: log
    attributes:
      label: Log / Журнал
      description: Start with GLASS_LOG=1 set and attach glass.log from the program folder. / Запустите с GLASS_LOG=1 и приложите glass.log из папки программы.
      render: text

# Push a tag like v0.2.0 to build the portable zip and publish it as a GitHub release.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/cache@v4
        with:
          path: models_cache
          key: ocr-models-v1

      - name: Build portable zip
        shell: pwsh
        run: ./build-portable.ps1 -Version ('${{ github.ref_name }}'.TrimStart('v'))

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: CHANGELOG.md
